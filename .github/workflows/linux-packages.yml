name: linux-packages

on:
  push:
    branches: [main, hybrid-features]
    tags: ['v*']
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake \
            squashfs-tools file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch nfqws/tpws engine
        run: ./scripts/fetch-zapret.sh

      - name: Build AppImage (builds Rust + Flutter internally)
        run: ./scripts/build-appimage.sh

      - name: Build DEB package
        run: ./packaging/deb/build-deb.sh --out dist

      - name: Collect packages
        run: |
          mkdir -p dist-collect
          mv Nukera-Linux-x86_64.AppImage dist-collect/
          find packaging/deb -name '*.deb' -exec cp {} dist-collect/ \;
          ls -la dist-collect/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nukera-linux-packages
          path: dist-collect/*
          if-no-files-found: error

      - name: Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-collect/*
