name: android-apk

on:
  push:
    branches: [main, hybrid-features]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch byedpi sources (required by native-lib.c)
        run: |
          TAG="$(curl -sL https://api.github.com/repos/hufrea/byedpi/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)"
          echo "byedpi tag: $TAG"
          curl -fL "https://github.com/hufrea/byedpi/archive/refs/tags/${TAG}.tar.gz" \
            -o /tmp/byedpi.tar.gz
          tar -xzf /tmp/byedpi.tar.gz -C /tmp
          SRC="$(find /tmp -maxdepth 1 -type d -name 'byedpi-*' | head -1)"
          mkdir -p android-source/app/src/main/cpp/byedpi
          cp "$SRC"/*.c "$SRC"/*.h android-source/app/src/main/cpp/byedpi/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Point cargo-ndk at the preinstalled NDK
        run: |
          NDK_DIR="$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -1)"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build tg-ws-proxy (Rust → Android)
        working-directory: android-source/rust/tgwsproxy
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 21 \
            build --release
          mkdir -p ../../app/src/main/jniLibs-tg/arm64-v8a \
                   ../../app/src/main/jniLibs-tg/armeabi-v7a \
                   ../../app/src/main/jniLibs-tg/x86_64
          cp target/aarch64-linux-android/release/libtgwsproxy.so \
             ../../app/src/main/jniLibs-tg/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtgwsproxy.so \
             ../../app/src/main/jniLibs-tg/armeabi-v7a/
          cp target/x86_64-linux-android/release/libtgwsproxy.so \
             ../../app/src/main/jniLibs-tg/x86_64/

      - name: Build APKs (debug + release)
        working-directory: android-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p apks
          find android-source/app/build/outputs/apk -name '*.apk' \
            -exec cp {} apks/ \;
          ls -la apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nukera-android-apk
          path: apks/*.apk
          if-no-files-found: error

      - name: Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
